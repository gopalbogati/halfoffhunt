name: deals
on:
  schedule:
    - cron: "*/5 * * * *"      # GitHub may delay scheduled runs by a few minutes at busy times
  workflow_dispatch:
concurrency:
  group: deals
  cancel-in-progress: false
permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@v4
      - name: Restore state
        uses: actions/cache/restore@v4
        with:
          path: |
            state.json
            stores_state.json
            site/data
            site/feed.xml
          key: state-none
          restore-keys: state-
      - name: OzBargain private alerts (price errors, cheap, Sydney food)
        run: python3 ozwatch.py
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
      - name: Retailer sale scan (every 30 min)
        run: python3 stores.py --if-due 28
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      - name: Save state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            state.json
            stores_state.json
            site/data
            site/feed.xml
          key: state-${{ github.run_id }}
      - name: Check if site needs publishing
        id: due
        run: |
          if [ -f .scanned ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then echo "go=1" >> "$GITHUB_OUTPUT"; fi
      - name: Build site
        if: steps.due.outputs.go == '1'
        run: python3 build_site.py
      - uses: actions/upload-pages-artifact@v3
        if: steps.due.outputs.go == '1'
        with:
          path: site
      - uses: actions/deploy-pages@v4
        if: steps.due.outputs.go == '1'
