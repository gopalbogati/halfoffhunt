name: deals
on:
  schedule:
    - cron: "*/5 * * * *"      # GitHub may delay scheduled runs by a few minutes at busy times
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: deals
  cancel-in-progress: false
permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@v4
      - name: Configure Cloudflare address when enabled
        if: vars.CLOUDFLARE_PROJECT_NAME != ''
        env:
          CF_PROJECT: ${{ vars.CLOUDFLARE_PROJECT_NAME }}
        run: |
          python3 - <<'PYCONFIG'
          import json, os, re
          from pathlib import Path
          project = os.environ['CF_PROJECT']
          if not re.fullmatch(r'[a-z0-9][a-z0-9-]{0,56}[a-z0-9]', project):
              raise SystemExit('Invalid Cloudflare Pages project name')
          path = Path('site_config.json')
          cfg = json.loads(path.read_text())
          cfg['site_url'] = f'https://{project}.pages.dev'
          path.write_text(json.dumps(cfg, indent=2) + '\n')
          PYCONFIG
      - name: Test scanner
        run: python3 -m unittest discover -s tests -v
      - name: Restore state
        uses: actions/cache/restore@v4
        with:
          path: |
            private_alert_state.json
            feed_cursor.json
            stores_state.json
            site/data
            site/feed.xml
          key: state-v2-none
          restore-keys: state-v2-
      - name: Personal RSS alerts (choices come from the private ALERT_SETTINGS secret)
        continue-on-error: true
        run: python3 ozwatch.py --alerts-only
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          ALERT_SETTINGS: ${{ secrets.ALERT_SETTINGS }}
      - name: Retailer sale scan (every 30 min)
        run: python3 stores.py --if-due 28
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          ALERT_SETTINGS: ${{ secrets.ALERT_SETTINGS }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      - name: Save state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            private_alert_state.json
            feed_cursor.json
            stores_state.json
            site/data
            site/feed.xml
          key: state-v2-${{ github.run_id }}
      - name: Check if site needs publishing
        id: due
        run: |
          if [ -f .scanned ] || [ "${{ github.event_name }}" != "schedule" ]; then echo "go=1" >> "$GITHUB_OUTPUT"; fi
      - name: Build site
        if: steps.due.outputs.go == '1'
        run: python3 build_site.py
      - uses: actions/upload-pages-artifact@v3
        if: steps.due.outputs.go == '1' && vars.CLOUDFLARE_PROJECT_NAME == ''
        with:
          path: site
      - uses: actions/deploy-pages@v4
        if: steps.due.outputs.go == '1' && vars.CLOUDFLARE_PROJECT_NAME == ''
      - name: Check Cloudflare secrets and project
        if: steps.due.outputs.go == '1' && vars.CLOUDFLARE_PROJECT_NAME != ''
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_PROJECT: ${{ vars.CLOUDFLARE_PROJECT_NAME }}
        run: |
          missing=""
          [ -n "$CLOUDFLARE_API_TOKEN" ] || missing="$missing CLOUDFLARE_API_TOKEN"
          [ -n "$CLOUDFLARE_ACCOUNT_ID" ] || missing="$missing CLOUDFLARE_ACCOUNT_ID"
          if [ -n "$missing" ]; then
            echo "::error::CLOUDFLARE_PROJECT_NAME is set but these repository secrets are missing:$missing (see CLOUDFLARE-SETUP.md)"
            exit 1
          fi
          # Direct Upload projects must exist before 'pages deploy'; create it on first run
          if ! npx -y wrangler@4 pages project list 2>/dev/null | grep -qw "$CF_PROJECT"; then
            npx -y wrangler@4 pages project create "$CF_PROJECT" --production-branch=main
          fi
      - name: Deploy to Cloudflare Pages
        if: steps.due.outputs.go == '1' && vars.CLOUDFLARE_PROJECT_NAME != ''
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy site --project-name=${{ vars.CLOUDFLARE_PROJECT_NAME }} --branch=main
